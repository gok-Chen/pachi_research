### 9月排名重點分析

2026年9月最大的亮點是「スマスロ リコリス・リコイル」空降人氣榜第二位。9月7日導入的這台新機種以純增約8.4枚/G的高速出玉和「疑似ボーナス連打」的爽快遊戲性，一舉躍升至僅次於東京喰種的位置。

特別值得注目的是：
- **東京喰種王朝延續**：導入超過19個月的 L 東京喰種 繼續穩坐人氣榜首，創造パチスロ史上罕見的長期稼動紀錄。
- **リコリコ旋風襲來**：導入僅3週就空降第二位，純增約8.4枚/G 的高速出玉和話題動畫 IP 是成功關鍵。
- **とある系列穩定輸出**：禁書目録2 導入近2個月仍維持 TOP3，「幻想變換」系統的獨特性持續吸引玩家。
- **かのかり緊追在後**：彼女、お借りします 同為9月7日導入，以114.9%的高機械割和「1Gレンチャンス」系統躋身 TOP4。
- **6月雙雄退位**：SAO Ⅱ 和 戦国乙女5 被9月新台擠出 TOP4，但稼動率依然維持高水準。

### ② スマスロ リコリス・リコイル（サミー）

![スマスロ リコリス・リコイル 筐体](pachislot/images/10_lycoris_recoil/cabinet.jpg)
![スマスロ リコリス・リコイル ゲームフロー](pachislot/images/10_lycoris_recoil/game_flow.jpg)
![スマスロ リコリス・リコイル 大当り詳細](pachislot/images/10_lycoris_recoil/hit_rate.jpg)

**原作IP：** 動畫「リコリス・リコイル」（A-1 Pictures 製作）。2022年夏季播出的原創動畫，描繪「リコリス」（秘密組織 DA 的少女特工）千束與たきな的故事。獨特的百合＋動作＋咖啡廳日常的組合在播出時成為話題。

**賣點與好玩之處：**
- 純增約8.4枚/G，業界頂級的出玉速度
- 機械割 97.9%～114.6%，設定6時高達114.6%
- 「リコリスラッシュ」是疑似ボーナス連打型AT
- AT 有通常版（リコリスラッシュ20/50）和上位版（リコリスラッシュW）
- 「才能」系統：レベル0/1/2 影響小役變換和ボーナス期待度
- 「千束ラッシュ」和「たきなラッシュ」兩種模式，各強化不同小役
- 1000pt 達成で上位CZ「リコイル オブ リコリス」突入
- 上位CZ 成功率約70%，成功後進入上位ラッシュ
- 「レジェンダリーリコリス」是最強特化ゾーン，期待枚數約2400枚
- 設定判別要素豐富：サミートロフィー、終了画面、プロローグエピソード等
- 搭載楽曲：ALIVE、花の塔、タカラモノ、Radiant、Trigger

**中心思想：**
> 「日常與非日常的雙重生活」— スマスロ リコリス・リコイル 以「疑似ボーナス連打」為核心設計，對應原作中「喫茶リコリコでの日常」與「リコリスとしての戦い」的交替循環。通常ラッシュ（20G/50G）是「日常的任務」，上位ラッシュW是「真正的戦場」。「才能」系統對應千束和たきな各自的特長——千束強化チェリー（直覺行動），たきな強化スイカ（精密射撃）。1000pt累積後的上位CZ挑戰則是「決定命運的一戦」，成功與否決定能否進入真正的高回報狀態。純增8.4枚/G的高速出玉對應千束的「超人的反射神經」——一切都在瞬間決勝負。

**套用至其他遊戲的可能性：**
- 射擊遊戲的「雙人搭檔」系統 — 兩位角色各有特化能力
- 手遊的「日常任務＋特殊任務」系統 — 日常累積資源後挑戰高難度
- 動作遊戲的「連打系統」— 連續成功觸發更強的攻擊
- 育成遊戲的「才能開發」系統 — 角色能力的多層次強化
- 節奏遊戲的「咖啡廳經營」模式 — 日常與戰鬥的切換

**Slot Game 轉用分析：**

- **疑似ボーナス連打系統（Pseudo Bonus Chain）**
  對應「リコリスラッシュ」的疑似ボーナス連打設計：Free Spin 中觸發ボーナス後獲得固定枚數（100/200/300枚等），ボーナス結束後有約75%機率繼續 Free Spin。這種「獲得獎金→繼續挑戰」的循環讓每次ボーナス都是新的起點，而非終點。純增8.4枚對應的高速派彩讓整體節奏非常爽快。

  **舉例：** 觸發「リコリスラッシュ」進入 20G 的ボーナス高確狀態。第5G觸發「リコリスボーナス」——獲得 100 枚！ボーナス結束後「繼續判定...成功！」進入「リコリスラッシュ50」。第12G再次觸發「リコリスボーナスW」——獲得 200 枚！如此連打直到繼續判定失敗。每次ボーナス的瞬間派彩和「下一次還能繼續嗎？」的緊張感構成獨特魅力。

- **雙層ラッシュ系統（Dual Rush Tier）**
  對應「通常ラッシュ→上位ラッシュ」的層級設計：Free Spin 中累積 1000pt 後可挑戰「上位CZ」，成功率約70%。成功後進入「上位ラッシュ」——繼續率更高、ボーナス必定是高配版。這種「累積→挑戰→升級」的流程讓玩家在通常ラッシュ時就有「升級期待」。

  **舉例：** 通常ラッシュ中持續累積 pt...800pt...900pt...「1000pt達成！」進入「リコイル オブ リコリス」（上位CZ）。10G的挑戰開始——第3G出現レア役！「成功期待度アップ！」...最終G——「上位ラッシュ突入！」畫面轉為金色，接下來的ボーナス全部是高配版，繼續率也提升。那種「升級成功！」的達成感正是本機的醍醐味。

**機率設計要點套用：**

以下為轉用示範，非原機規格，尚未校準；各玩法分開示例，不預設全部疊加。

**疑似ボーナス連打系統（Pseudo Bonus Chain）**

規格與機率：每段20轉，每轉10%中獎包；成功時60%100分、30%200分、10%300分，隨即結束本段，75%開下一段、25%結算；20轉皆未中也結束。

**例子：** 本段得200分後續行成功，再開20轉；不把200分當成進下一段的機率。

**雙層ラッシュ系統（Dual Rush Tier）**

規格與機率：每個Bonus給100pt，滿1000pt必開一次上位CZ；70%升級、30%維持普通並清空點數。上位獎包改200／300分，各50%，段後85%續。

**例子：** 已900pt再中一包就能挑戰；抽到30%失敗仍保留原獎，點數回0。

**Fish Game 轉用分析：**

- **雙人切換系統（Dual Agent Switch）**
  對應「千束」和「たきな」的雙主角設定：玩家可在兩位リコリス之間切換，各有不同的砲台特性。千束模式是「直覺射擊」——自動瞄準最近的魚，射速快但傷害略低；たきな模式是「精密射擊」——手動瞄準，射速慢但傷害高且可穿透。根據場上情況切換角色是制勝關鍵。

  **舉例：** 場上同時出現大量快速小魚和緩慢移動的大魚。切換至「千束模式」——砲台自動追蹤小魚，快速清場。小魚清完後切換至「たきな模式」——瞄準大魚弱點，2發高傷害彈藥擊殺。切換時有1秒冷卻時間，如何在適當時機切換考驗玩家判斷。

- **喫茶リコリコ經營系統（Café LycoReco Management）**
  對應原作「喫茶リコリコ」的設定：遊戲中設置「咖啡廳區域」，擊殺特定魚類可獲得「咖啡豆」。累積咖啡豆可兌換各種 Buff——「千束特調」：30秒射速 ×1.5；「たきな特調」：30秒傷害 ×1.5；「くるみ特調」：30秒自動瞄準輔助。這種「收集→兌換」的系統增加遊玩深度。

  **舉例：** 擊殺「咖啡魚」獲得5顆咖啡豆，累積至30顆後可在「喫茶リコリコ」兌換 Buff。選擇「千束特調」——接下來30秒射速提升50%，適合清理小魚潮。或選擇「くるみ特調」——啟動自動瞄準輔助，適合新手玩家。不同的選擇對應不同的遊玩風格。

**賣點與好玩之處：**
- 純增約5.0枚/G，機械割 97.7%～114.9%（設定6時為本期最高水準）
- 通常時是レア役和規定ゲーム數契機的CZ，成功後進入ボーナス

- 設定6的機械割114.9%是本期最高水準（與東京喰種並列）

**中心思想：**
> 「出租的約會，真實的心動」— Lパチスロ 彼女、お借りします 以「1Gレンチャンス」為核心設計，對應原作中「每次約會（レンタル）都可能發展成真實戀情」的主題。ボーナス後必定進入的1Gレンチャンス是「約會後的告白時刻」——成功（約40%）則繼續下一次約會（ボーナス連打），失敗則暫時分離（通常時復歸）。「變換高確率」對應和也對千鶴的感情「越來越認真」——一旦進入狀態，原本普通的互動（小役）也會變得特別（強化）。4位ヒロイン的存在則是「後宮」系作品的醍醐味，讓玩家能選擇自己喜愛的角色進行遊玩。

- 抽卡遊戲的「連抽」機制 — 抽中後有機率觸發追加抽選

**Slot Game 轉用分析：**

- **1Gレンチャンス系統（1G Reroll Chance）**
  對應「ボーナス後1Gレンチャンス」的核心機制：Free Spin 或 Bonus 結束時進入「1G 再抽選」，約40%機率直接獲得追加 Free Spin/Bonus。這種「結束時的逆轉機會」讓每次看似結束的瞬間都充滿期待。連續成功的話可以無限連打。

  **舉例：** Bonus 結束，獲得 80x——「1Gレンチャンス！」畫面顯示千鶴伸出手，玩家按下按鈕...「成功！」追加 Bonus 開始！再次獲得 100x——「1Gレンチャンス！」...「成功！」又一次追加！如此連打5次，總獲得 500x。那種「本以為結束了但還能繼續」的驚喜感正是本機魅力。

- **ヒロイン選擇系統（Heroine Selection）**
  對應4位ヒロイン各有特色的設定：遊戲開始時選擇1位ヒロイン，各有不同的特化能力。「水原千鶴」：平衡型；「更科瑠夏」：高頻率低倍率；「桜沢墨」：低頻率高倍率；「七海麻美」：特殊演出多。選擇不同角色會影響遊玩體驗和報酬結構。

  **舉例：** 遊戲開始選擇「更科瑠夏」——活潑的瑠夏擔任導航，Bonus 觸發率 ×1.2 但單次倍率略低。或選擇「桜沢墨」——害羞的墨擔任導航，Bonus 觸發率較低但單次倍率 ×1.3。喜歡穩定的玩家選千鶴，喜歡爆發的選墨，喜歡頻繁演出的選瑠夏。

| 機種 | 中心思想關鍵字 | 其他遊戲轉用度 | 轉用目標類型範例 |

| L 東京喰種 | 覺醒的二重性＋穢れ累積 | ★★★★★ | RPG變身、累積爆發、長期留存 |
| スマスロ リコリス・リコイル | 日常與非日常＋高速連打 | ★★★★★ | 雙人切換、疑似ボーナス連打、才能系統 |
| スマスロ とある魔術の禁書目録2 | 幻想變換＋角色特化 | ★★★★★ | 狀態變換、角色差異化、連鎖系統 |
| Lパチスロ 彼女、お借りします | 約會連打＋ヒロイン選擇 | ★★★★☆ | 1G連打、角色選擇、好感度系統 |

**本月最具亮點的設計：** スマスロ リコリス・リコイル 的「疑似ボーナス連打＋才能系統」。純增約8.4枚/G的高速出玉讓每次ボーナス都能快速獲得報酬，而ボーナス後約75%的繼續率讓「連打」成為常態而非例外。「才能」系統（レベル0→1→2）讓對應小役的期待度逐步提升，玩家有「培育」的感覺。加上「千束ラッシュ/たきなラッシュ」的雙模式設計，讓同一台機器能提供不同的遊玩體驗。這種「高速＋連打＋培育＋選擇」的多層次設計值得學習。

**市場趨勢觀察：**
- **東京喰種王朝延續**：導入19個月仍穩居第一，創造スマスロ時代的空前紀錄。
- **リコリコ旋風襲來**：導入僅3週就空降第二，證明「高純增＋話題IP」的市場破壞力。
- **9月新台雙雄並立**：リコリコ和かのかり同日導入分居第二、第四，9月新台表現亮眼。
- **とある系列穩定輸出**：禁書目録2 導入近2個月仍維持 TOP3，「幻想變換」系統的獨創性獲得認可。
- **6月機種退位但長青**：SAO Ⅱ 和 戦国乙女5 被擠出 TOP4，但稼動率依然高，證明優質 IP 機種的持久力。
- **ハナハナ系列勝率穩定**：技術介入型機種在勝率榜持續領先，對追求穩定收益的玩家有吸引力。

**長期稼動力分析：** L 東京喰種 導入19個月仍維持人氣第一，這在スマスロ時代是空前絕後的紀錄。其成功要素包括：「覺醒＋穢れ」的累積爆發系統、適度的機械割、以及「有馬貴将ジャッジメント」的終極爆發力。リコリス・リコイル 的長期稼動力有待觀察，但純增8.4枚/G的高速出玉和話題 IP 的組合有潛力成為長青機種。彼女、お借りします 的114.9%高機械割對設定狙い玩家有吸引力，但一般遊玩時的表現有待觀察。

    const t = el.textContent.length > 35 ? el.textContent.slice(0, 35) + '...' : el.textContent;
    s += '<a href="#' + id + '" class="toc-' + lv + '">' + t + '</a>';
  });
  toc.innerHTML = s;
}

function wrapAnalysisSections() {
  const paragraphs = content.querySelectorAll('p');
  paragraphs.forEach(p => {
    const strong = p.querySelector('strong');
    if (!strong) return;
    const text = strong.textContent;
    let className = null;
    if (text.includes('Slot Game 轉用分析')) className = 'slot-analysis';
    else if (text.includes('Fish Game 轉用分析')) className = 'fish-analysis';
    if (!className) return;
    const wrapper = document.createElement('div');
    wrapper.className = className;
    let sibling = p.nextElementSibling;
    const collected = [];
    while (sibling && !['H2','H3','HR'].includes(sibling.tagName) && !sibling.querySelector('strong[class]')) {
      const strongInside = sibling.querySelector('strong');
      if (strongInside && (strongInside.textContent.includes('Slot Game 轉用分析') || strongInside.textContent.includes('Fish Game 轉用分析'))) break;
      collected.push(sibling);
      sibling = sibling.nextElementSibling;
    }
    p.parentNode.insertBefore(wrapper, p);
    wrapper.appendChild(p);
    collected.forEach(el => wrapper.appendChild(el));
  });
}

function wrapExamples() {
  content.querySelectorAll('strong').forEach(strong => {
    if (!strong.textContent.includes('舉例')) return;
    const p = strong.closest('p');
    if (!p || p.closest('.example-block')) return;
    const wrapper = document.createElement('div');
    wrapper.className = 'example-block';
    p.parentNode.insertBefore(wrapper, p);
    wrapper.appendChild(p);
  });
}

function render() {
  const mdEl = document.getElementById('report-md');
  if (!mdEl) return;
  let html = marked.parse(mdEl.textContent);
  content.innerHTML = html;
  content.querySelectorAll('img').forEach(img => {
    img.loading = 'lazy';
    img.onerror = function() {
      const e = document.createElement('span');
      e.className = 'img-error';
      e.textContent = '\u26A0 ' + img.getAttribute('src');
      img.parentNode.insertBefore(e, img.nextSibling);
      img.style.display = 'none';
    };
    img.onclick = () => { lightboxImg.src = img.src; lightbox.classList.add('active'); };
  });
  wrapAnalysisSections();
  wrapExamples();
  buildTOC();
}

btnToc.addEventListener('click', () => toc.classList.toggle('active'));
lightbox.addEventListener('click', () => lightbox.classList.remove('active'));
window.addEventListener('scroll', () => btnTop.classList.toggle('visible', window.scrollY > 400));
btnTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

render();

// Hash-based scroll: scroll to heading containing the hash text
function scrollToHash() {
  const hash = decodeURIComponent(window.location.hash.slice(1));
  if (!hash) return;
  const normalizedHash = hash.replace(/[\s\-]+/g, '');
  const headings = content.querySelectorAll('h1,h2,h3');
  for (const el of headings) {
    const normalizedText = el.textContent.replace(/[\s\-]+/g, '');
    if (normalizedText.includes(normalizedHash)) {
      setTimeout(() => {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        el.style.transition = 'background 0.3s';
        el.style.background = '#fff3cd';
        setTimeout(() => { el.style.background = ''; }, 2000);
      }, 300);
      return;
    }
  }
}
scrollToHash();
window.addEventListener('hashchange', scrollToHash);
</script>
