## 3. 各機種賣點・中心思想・遊戲設計分析

### ① e Re:ゼロから始める異世界生活 鬼がかり2（大都技研）

![Re:ゼロ 鬼がかり2 筐体](pachinko/images/12_rezero_onigakari2/cabinet.jpg)
![Re:ゼロ 鬼がかり2 遊戲流程](pachinko/images/12_rezero_onigakari2/game_flow.jpg)
![Re:ゼロ 鬼がかり2 大當詳細](pachinko/images/12_rezero_onigakari2/hit_rate.jpg)

**賣點與好玩之處：**
通常時 1/349.9，初當後 55% 進入 RUSH，進入即發動 LT。RUSH 為 ST144 回、續約77%；延續契機包含大當與 ST 重設。玩家除了期待派彩，也會關注剩餘回數是否重新獲得。這個「重設」不能當成每次都獲得大額出玉。原機規格以 [DMM 機種頁](https://p-town.dmm.com/machines/5094) 為準。

**中心思想：**
設計解讀：「讓剩餘機會本身也成為獎勵」。倒數帶來結束壓力，重設讓壓力暫時解除；真正的高額結果則提供另一層期待。價值來自倒數與重設的交替，並不意味玩家必定能持續。

**套用至其他遊戲的可能性：**
RPG 可把倒數重設轉成限時副本中的延長事件；動作遊戲可用擊破關鍵目標補充挑戰時間。兩者都應明示延長是否有上限，避免玩家不知道何時結束。

**Slot Game 轉用分析：**

- **倒數重設型 Free Spin**
  設計提案：Bonus 採 Free Spin（免費轉動）形式，初始 10 轉。每轉消耗 1 轉；特殊重設圖案使剩餘回數回到 10，但最多重設 2 次，整輪最多 30 轉。重設只補回數，不額外派獎，倍率不會因此永久上升。

  **舉例：** 玩家取得10轉，第8轉出現重設圖案，畫面顯示「剩餘10轉／重設剩1次」。下一輪又重設一次後，圖示改成「重設已用完」；之後再出現該圖案僅作普通圖案處理。剩餘回數歸零即結算。若全程沒出現重設，原本10轉用完便結束，已中的獎金保留。

- **派彩與續命分開告知**
  設計提案：同一輪10轉 Free Spin 中，金色圖案是加獎，藍色圖案是補機會。藍色只可觸發1次並增加3轉，整輪最多13轉；兩種事件用不同音效與文字，避免延長被誤讀成大獎。

  **舉例：** 第4轉出現金色圖案，立即增加20倍投注獎金；第9轉出現藍色圖案，畫面寫「增加3轉，沒有額外派彩」。若後續未中獎，13轉用完就帶著原有獎金退出；整輪沒有藍色圖案則在第10轉結束。額外轉數僅本輪有效。

**機率設計要點套用：**

以下是轉用後的示範規格與機率，不是原機比例，也尚未校準成正式配獎。

**倒數重設型 Free Spin**

規格與機率：沿用10轉、最多重設2次。Bonus每轉只選一種結果：60%沒獎、20%得2倍、10%得5倍、5%得20倍、5%只把剩餘轉數回到10。重設用完後，最後這5%改為沒獎，不再延長。這是把原機「不同獎額＋純重設」改成Slot結果表。

**例子：** 剩2轉時抽到5%的重設，變回10轉但不加獎金；下一轉抽到20倍，就只加20倍並正常扣1轉。

**派彩與續命分開告知**

規格與機率：沿用金色加獎、藍色補3轉。每轉金色20%出現、給20倍；藍色5%出現，只可用一次。兩者分別判定，可同轉出現；藍色用過後不再判定。

**例子：** 同一轉出現金色與藍色，就拿20倍並加3轉；只有藍色就只加3轉。

**Fish Game 轉用分析：**

- **限次延長的 Boss 挑戰**
  設計提案：特殊入口開啟30秒 Boss 戰，提供60發專用免費彈。擊破護盾可把計時重設至30秒，但僅限1次；彈藥不補充。時間到或60發用完任一條件成立便結束，確保資源與時間都有邊界。

  **舉例：** 玩家剩8秒、20發時打破護盾，畫面顯示「倒數重設30秒／剩20發」。最後20發打完仍沒擊殺，Boss 撤退、專用彈歸零；若先擊殺則領取本次獎勵並提前結束。重設不是必然擊殺，也不影響普通砲台之後的能力。

- **續命與擊殺兩種回饋**
  設計提案：30秒活動內最多出現1顆時間球。擊中時間球增加10秒，擊殺 Boss 才給擊殺獎勵；活動初始50發免費彈，撿球不補彈，結束條件為時間到、彈用完或 Boss 被擊殺。

  **舉例：** 玩家先擊中時間球，字幕明示「延長10秒／尚未擊殺」。若剩餘彈藥仍未打倒 Boss，時間到就退出，沒有 Boss 獎；若成功擊殺則結算並收回未使用專用彈。這讓「多一次機會」和「已經獲獎」在畫面上清楚區分。

**機率設計要點套用：**

以下是轉用後的示範規格與機率，不是原機比例，也尚未校準成正式配獎。

**限次延長的 Boss 挑戰**

規格與機率：沿用30秒、60發、最多延長一次。示範採捕獲判定：每次有效命中先以2%判定擊殺；未擊殺時，再以10%判定破盾並重設30秒。破盾不給分、不補彈，用過後不再延長。

**例子：** 剩8秒、20發時未擊殺但抽到破盾，變成30秒、20發；之後仍須擊殺才領Boss獎。

**續命與擊殺兩種回饋**

規格與機率：沿用30秒、50發。每場以30%機率出現唯一一顆時間球，擊中必加10秒；對Boss每次有效命中以2%判定擊殺。拿球不給Boss分、不補彈。

**例子：** 本場有時間球，玩家擊中後多10秒；若後續都沒抽到擊殺，仍沒有Boss獎。

### ④ Pドラムde 電音部 超ドラ熱4500ver.（ミズホ）

![電音部 筐体](pachinko/images/13_denonbu/cabinet.jpg)
![電音部 遊戲流程](pachinko/images/13_denonbu/game_flow.jpg)
![電音部 大當詳細](pachinko/images/13_denonbu/hit_rate.jpg)

**賣點與好玩之處：**
通常時1/259.0；初當50%進入1回的挑戰，突破期待度50%，另有初當1%直行超ドラ熱ATTACK。ATTACK 每輪1回、繼續率50%，中獎以4500個為單位呈現（1500個×3回），不是每次普通大當都給4500個。通常550回後可發動遊タイム，細節與限制參閱 [DMM 電音部](https://p-town.dmm.com/machines/5066)。

**中心思想：**
設計解讀：「把入口挑戰與大包獎勵切成容易理解的節點」。挑戰的結果明確，通過後每次成功以固定包裝呈現，但每輪也都可能結束。不能把「50%進挑戰」誤寫成「50%進入 ATTACK」。

**套用至其他遊戲的可能性：**
卡牌遊戲可用一道門檻後的獎勵連開；音樂遊戲可用短段落完成後開啟下一段。若延用兩道門檻，應在介面上分別顯示，避免玩家把第一關成功當成已取得最終獎勵。

**Slot Game 轉用分析：**

- **一次判定的入口與連開獎勵**
  設計提案：Bonus 採「開箱回合」，不是 Free Spin。觸發後先做1次入口判定，示範成功率50%；成功先得固定20倍投注，之後每次以50%判定再加20倍，最多加獎4次。任一次失敗或達到總計5包即結束；已入帳獎金不追回。

  **舉例：** 玩家入口成功先拿20倍，再連續通過2次判定，總計60倍；第3次失敗就立即結算60倍。若入口就失敗，開箱回合直接結束，沒有連開獎金。這些50%與20倍僅是提案示範值，實作時須另行設計整體數學模型。

- **固定總額分段揭曉**
  設計提案：抽中30倍投注的 Bonus 後，畫面以3個各10倍的音樂段落依序揭曉。總額在進入時已決定，沒有再押注或第二次抽選；3段播完即退出，可跳過動畫。未抽中 Bonus 的普通轉動不進入此段。

  **舉例：** 玩家觸發後看到「本次已獲得30倍」，鼓點每響一次揭曉10倍，第三段後總計30倍並結算。按下跳過仍拿30倍。若本轉未觸發，便按普通轉動結果結算，不會只因沒進動畫而失去原本中獎。

**機率設計要點套用：**

以下是轉用後的示範規格與機率，不是原機比例，也尚未校準成正式配獎。

**一次判定的入口與連開獎勵**

規格與機率：沿用入口50%成功；成功先給20倍，之後每次50%再加20倍，最多5包、合計100倍。失敗立即停止。這是把原機「入口→固定獎包→逐包續行」直接換成Slot規格。

**例子：** 入口成功拿20倍，再連續兩次成功就是60倍；下一次失敗，結算60倍。

**固定總額分段揭曉**

規格與機率：示範主遊戲每轉1%取得30倍Bonus；取得後固定分3段，每段10倍，不再抽機率。其餘99%依原普通盤面結算。

**例子：** 本轉抽到30倍，依序演10、10、10倍；跳過動畫仍是30倍，不會變成三次抽獎。

**Fish Game 轉用分析：**

- **單次門票與連續寶箱**
  設計提案：擊殺活動魚獲得1張免費門票；每張只做1次入口判定。成功給1箱，再逐箱判定是否續開，最多5箱，每箱固定100活動分。失敗即停，已得分保留；活動分與現金獎勵分開標示，門票不跨場累積。

  **舉例：** 玩家使用門票，入口成功，拿100活動分；第二箱成功累計200分，第三箱失敗即退出。入口失敗則票消耗完、沒有寶箱分，不會自動扣普通子彈再試。活動結束時未使用門票依事先公告失效，不能無限保留。

- **一包獎勵的三拍演出**
  設計提案：活動 Boss 被擊殺後已確定給300活動分，以3次各100分的鼓點演出揭曉。只改變結算表演，不增加判定次數。Boss 戰限30秒、給40發免費專用彈；時間到或彈用完仍未擊殺就退出，沒有擊殺分。

  **舉例：** 玩家第28發擊殺，畫面先顯示總分300，再依三拍入帳；中途跳過仍拿300分，剩餘專用彈收回。若40發全用完仍未擊殺，Boss 離場，三拍演出不啟動，砲台回到普通狀態。

**機率設計要點套用：**

以下是轉用後的示範規格與機率，不是原機比例，也尚未校準成正式配獎。

**單次門票與連續寶箱**

規格與機率：示範每次擊殺活動魚有10%掉1張票；用票後50%開第一箱，之後每箱50%續開，每箱100活動分，最多5箱。入口或續箱失敗就停。

**例子：** 用票後第一箱成功、第二箱成功、第三箱失敗，最後拿200分；票已消耗。

**一包獎勵的三拍演出**

規格與機率：沿用30秒、40發；每次有效命中以3%判定Boss被擊殺，擊殺即確定300分，再分3次各100分播報。三拍不各自抽獎。

**例子：** 第28發有效命中並成功擊殺，已確定拿300分；看完三拍或跳過都一樣。

### ⑤ 月底補入：P 新世紀エヴァンゲリオン -319 RED-（ビスティ）

![EVA 319 RED 機台](pachinko/images/14_eva319red/cabinet.webp)
![EVA 319 RED 遊戲流程](pachinko/images/14_eva319red/game_flow.jpg)
![EVA 319 RED 大當詳細](pachinko/images/14_eva319red/hit_rate.jpg)

**原機規格與賣點：** 10/19 導入，通常與時短中為 1/319.7，ST 中 1/98.9。初當約65%直接進 ST；未直行者有100回時短，含引回後總 ST 突入約75%。ST161回，續約81%（含殘保留引回約1.2%），右打大當均1500玉払い出し。約75%與約81%分屬入口與延續，不能相乘後冒稱玩家勝率。來源：[DMM 機種頁](https://p-town.dmm.com/machines/5091)，11/05 補查，並非10/31封存版本。

**中心思想（設計解讀）：** 把「沒有直接進入」接成一段仍可翻轉的等待，再用固定出玉單位降低右打結果的閱讀負擔。10月稼動第2足以支持列為比較對象；尚不能證明時短或IP單獨造成高稼動。

**套用至其他遊戲的可能性：** 任務失敗後提供一次有期限的補考，而非直接放回主選單。補考必須明示成功條件與結束點，避免誤認為已拿到主獎勵。

**Slot Game 轉用分析：**

- **主入口失敗後的一次補考**：提案為8轉 Free Spin。入口未通過時給3次免費補考判定；成功便結束補考並進8轉，三次皆失敗則退出。補考本身不派彩，也不能再次開補考；最多共11次判定。

  **舉例：** 玩家入口失敗，第二次補考成功後取得完整8轉；若3次皆失敗，顯示本次未進Bonus，回主遊戲。這是新增的機率成本，不能沿用原入口機率還宣稱RTP不變。

- **固定獎包，演出可選**：提案每次中獎固定10倍投注，玩家選簡潔告知或角色演出；模式不改獎金、機率或回數。未中獎則0倍，顯示結果後結束本次轉動。

  **舉例：** 同一10倍結果可立即揭曉或看5秒演出，跳過仍給10倍。單次中獎告知不表示下一轉會延續。

**機率設計要點套用：**

以下是轉用後的示範規格與機率，不是原機比例，也尚未校準成正式配獎。

**主入口失敗後的一次補考**

規格與機率：示範主入口50%成功，直接進8轉；失敗才給3次補考，每次20%成功，成功即停止補考並進8轉，三次都失敗就退出。這是把原機「直行＋時短引回」換成Slot的兩條入口。

**例子：** 主入口失敗，第一次補考失敗、第二次成功，取得完整8轉；不再做第三次補考。

**固定獎包，演出可選**

規格與機率：每次轉動20%給10倍、80%沒獎；簡潔／角色演出共用這一份機率，兩種模式都不影響下一轉。

**例子：** 抽到10倍後，選簡潔就立即顯示，選角色就播5秒；兩者都只拿10倍。

**Fish Game 轉用分析：**

- **限次救援任務**：30秒、40發免費專用彈的Boss戰失敗後，提供唯一一次5秒、5發的救援；擊殺給200活動分，失敗為0分。主場已擊殺則不開救援，救援不能再延長。

  **舉例：** 主場時間到未擊殺，救援第4發擊殺便結算200分；5發用完仍失敗就退出。未用專用彈收回，沒有自動扣普通砲彈重試。

- **固定獎包的清楚告知**：活動目標每隻100活動分，可選快告知或角色播報；擊殺結果先確定再演出。活動限30秒、40發免費彈，時間或彈量用盡即結束，未擊殺不給該目標分。

  **舉例：** 連續擊殺2隻共200分，選慢演出也不增加第三隻判定；已得分在活動結束時保留。

**機率設計要點套用：**

以下是轉用後的示範規格與機率，不是原機比例，也尚未校準成正式配獎。

**限次救援任務**

規格與機率：沿用主場30秒40發、失敗才給一次5秒5發救援。示範每次有效命中5%擊殺，主場與救援都用同一機率；任一階段擊殺都只給一次200分。

**例子：** 主場未擊殺，進救援；第4次有效命中成功，拿200分並結束，不再抽剩下的彈。

**固定獎包的清楚告知**

規格與機率：沿用30秒40發；對每個仍存活的活動目標，每次有效命中10%捕獲，捕獲固定100分。快告知與角色播報不暫停或縮短可射擊時間。

**例子：** 捕獲兩隻就是200分；切換播報模式不會再抽一次，也不改成不同獎額。

## 5. 綜合總結

| 機種 | 設計解讀 | 優先轉用的體驗 | 必須交代的邊界 |
|------|----------|----------------|----------------|
| Re:ゼロ 鬼がかり2 | 剩餘機會本身是獎勵 | 倒數重設與派彩分開 | 重設次數、最大回數 |
| SAO 夜空 | 進入之後還有升級目標 | 分層狀態與升級期待 | 升級持續到何時 |
| 東京喰種 超デカ | 短回合集中回報 | 短挑戰搭配大額結算 | 失敗結果、機率口徑 |
| 電音部 | 門檻與固定大包切成節點 | 清楚的連開與分段揭曉 | 是否再次抽選、最多幾包 |
| EVA 319 RED | 時短補考接ST、固定1500玉 | 限次入口補考、同結果可選告知 | 補考資源與成功／失敗出口 |

本期最值得做原型的是 Re:ゼロ 的「續命與中獎分開」以及電音部的「固定獎勵包」。前者改變玩家對剩餘機會的感受，後者改善結果的易讀性。這是設計研究判斷；單次人氣榜不足以證明機制能提高留存或營收。月底補查已納入PAPIMO月間稼動與勝率，並補上EVA 319 RED。EVA的入口補考與固定獎包，可與Re:ゼロ的重設及電音部的連開形成對照；大海與羽根物入榜也提醒研究不應只聚焦大額LT。

function buildTOC() {
  const headings = content.querySelectorAll('h1,h2,h3');
  if (!headings.length) { toc.style.display = 'none'; return; }
  let s = '<h3>目次</h3>';
  headings.forEach((el, i) => {
    const id = 'h-' + i; el.id = id;
    const lv = el.tagName.toLowerCase();
    const t = el.textContent.length > 35 ? el.textContent.slice(0, 35) + '...' : el.textContent;
    s += '<a href="#' + id + '" class="toc-' + lv + '">' + t + '</a>';
  });
  toc.innerHTML = s;
}

function wrapAnalysisSections() {
  const paragraphs = content.querySelectorAll('p');
  paragraphs.forEach(p => {
    const strong = p.querySelector('strong');
    if (!strong) return;
    const text = strong.textContent;
    let className = null;
    if (text.includes('Slot Game 轉用分析')) className = 'slot-analysis';
    else if (text.includes('Fish Game 轉用分析')) className = 'fish-analysis';
    if (!className) return;
    const wrapper = document.createElement('div');
    wrapper.className = className;
    let sibling = p.nextElementSibling;
    const collected = [];
    while (sibling && !['H2','H3','HR'].includes(sibling.tagName) && !sibling.querySelector('strong[class]')) {
      const strongInside = sibling.querySelector('strong');
      if (strongInside && (strongInside.textContent.includes('Slot Game 轉用分析') || strongInside.textContent.includes('Fish Game 轉用分析'))) break;
      collected.push(sibling);
      sibling = sibling.nextElementSibling;
    }
    p.parentNode.insertBefore(wrapper, p);
    wrapper.appendChild(p);
    collected.forEach(el => wrapper.appendChild(el));
  });
}

function wrapExamples() {
  content.querySelectorAll('strong').forEach(strong => {
    if (!strong.textContent.includes('舉例')) return;
    const p = strong.closest('p');
    if (!p || p.closest('.example-block')) return;
    const wrapper = document.createElement('div');
    wrapper.className = 'example-block';
    p.parentNode.insertBefore(wrapper, p);
    wrapper.appendChild(p);
  });
}

function render() {
  const mdEl = document.getElementById('report-md');
  if (!mdEl) return;
  let html = marked.parse(mdEl.textContent);
  content.innerHTML = html;
  content.querySelectorAll('img').forEach(img => {
    img.loading = 'lazy';
    img.onerror = function() {
      const e = document.createElement('span');
      e.className = 'img-error';
      e.textContent = '\u26A0 ' + img.getAttribute('src');
      img.parentNode.insertBefore(e, img.nextSibling);
      img.style.display = 'none';
    };
    img.onclick = () => { lightboxImg.src = img.src; lightbox.classList.add('active'); };
  });
  wrapAnalysisSections();
  wrapExamples();
  buildTOC();
}

btnToc.addEventListener('click', () => toc.classList.toggle('active'));
lightbox.addEventListener('click', () => lightbox.classList.remove('active'));
window.addEventListener('scroll', () => btnTop.classList.toggle('visible', window.scrollY > 400));
btnTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

render();

// Hash-based scroll: scroll to heading containing the hash text
function scrollToHash() {
  const hash = decodeURIComponent(window.location.hash.slice(1));
  if (!hash) return;
  const normalizedHash = hash.replace(/[\s\-]+/g, '');
  const headings = content.querySelectorAll('h1,h2,h3');
  for (const el of headings) {
    const normalizedText = el.textContent.replace(/[\s\-]+/g, '');
    if (normalizedText.includes(normalizedHash)) {
      setTimeout(() => {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        el.style.transition = 'background 0.3s';
        el.style.background = '#fff3cd';
        setTimeout(() => { el.style.background = ''; }, 2000);
      }, 300);
      return;
    }
  }
}
scrollToHash();
window.addEventListener('hashchange', scrollToHash);
</script>
