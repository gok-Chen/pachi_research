## 1. 人氣排名與關注度

根據 DMMぱちタウン 的「人氣機種」區塊及新台導入資訊，2026年7月的重點パチンコ機種如下（2026/08/10 排名抓取，排除8月新台）。

| 2 | eリコリス・リコイル | ニューギン | 2026/04/06 |

### 7月排名重點分析

2026年7月最引人注目的是 TOP4 的高度穩定性。東京喰種系列（超デカ、通常版）與リコリス・リコイル 繼續維持強勢地位，三台都已在本報告中分析過。新亮點是 e 新世紀エヴァンゲリオン ～はじまりの記憶～ 以 2025/12/22 導入的「舊台」之姿，持續維持在人氣 TOP4，展示了エヴァIP的超長期吸引力——導入後超過7個月仍然穩定排名，這在 2026 年的高競爭市場中十分罕見。

## 3. 各機種賣點・中心思想・遊戲設計分析

### ① e 東京喰種 超デカ超一撃ver.（ビスティ）

![e 東京喰種 超デカ超一撃ver. 筐体](pachinko/images/01_tokyo_ghoul_deka/cabinet.jpg)

本機於5月報告已有詳細分析。連續三個月以上穩坐人氣第一，「約1/999初當＋最大9000個出玉」的極致設計持續吸引大量玩家。

**本月更新：** 導入滿兩個月，稼動表現依然極強，不受7月新台波及。高風險高回報的設計哲學完美契合核心玩家群，並形成「東京喰種大型雙機制霸」局面。

👉 [查看完整分析（2026年5月報告）](report_pachinko_202605.html#e東京喰種超デカ超一撃ver)

**Slot Game 轉用分析：**

👉 [查看 Slot Game 完整分析（2026年5月報告）](report_pachinko_202605.html#e東京喰種超デカ超一撃ver)

**機率設計要點套用：**

以下為轉用示範，非原機規格，尚未校準；各玩法分開示例，不預設全部疊加。

**Ultra High Volatility 單發設計（極低觸發率但 5000x+ 回報）**

規格與機率：示範每轉1/10000觸發大獎Bonus；觸發後80%總獎1000倍、15%3000倍、5%5280倍，以免費轉動畫揭曉。

**例子：** 抽到Bonus後再選到5%的最高分支，整輪合計5280倍；不是每轉都給5280倍。

**All-or-Nothing Bonus Round（全有或全無的獎勵回合）**

規格與機率：進Bonus後可選確領500倍，或選一次50%得3000倍、50%得50倍；選擇完成即結算。兩選項目前平均回報不同，不宣稱等價。

**例子：** 選挑戰並抽到失敗分支，拿50倍；原本可選的500倍不再另外發。

**Fish Game 轉用分析：**

👉 [查看 Fish Game 完整分析（2026年5月報告）](report_pachinko_202605.html#e東京喰種超デカ超一撃ver)

**機率設計要點套用：**

以下為轉用示範，非原機規格，尚未校準；各玩法分開示例，不預設全部疊加。

**超稀有傳說魚（整場僅出現一次、費用高昂但回報 1000 倍）**

規格與機率：每30分鐘固定一次傳說魚、停留30秒；每發成本為普通10倍，80%有效命中，命中後0.01%捕獲；成功依本次傳說魚活動總投入×1000分配。

**例子：** 全隊本次投入100單位，捕獲總獎100000單位；占10%有效傷害者分10000，未捕獲不發。

**50/50 生死判定機制（Double-or-Nothing 決戰）**

規格與機率：每次挑戰50%將目前獎額×2、50%只留目前獎額10%並結束；最多成功3次，成功後可收手。

**例子：** 起始100分，先成功變200分；第二次失敗只留20分，不再繼續第三次。

**本月更新：** 導入4個月後穩定維持第二位，「低規格＋高品質演出＋角色魅力」的長青公式再度得到驗證。モードA/B的內部切換系統讓玩家每次連莊都有差異化體驗。

**例子：** 第3轉升級，此時已玩3轉，之後還有9轉，不是另送完整12轉。

**例子：** 玩家完成20隻小魚開Boss；擊殺後占20%有效傷害，就得400分。

**Transformation Feature（角色變身升級所有後續中獎）**

規格與機率：每次中獎加1進度，滿50次必變身；本Session內5倍獎改15倍、2倍獎改8倍。示例普通10%中獎、變身後5%中獎，獎額分布另列待校準。

**例子：** 第50次中獎後變身，下一轉依強化權重抽；先前已結算的小獎不追補。

**長期參與型角色成長系統（跨 Session 進度累積）**

規格與機率：每付費轉加1經驗，滿100轉升1級並解鎖新Bonus；示例每次取得Bonus時90%普通、10%選已解鎖Bonus，未解鎖時100%普通。

**例子：** 升級後下次Bonus才有10%進新種類；若新種類回報較高，必須另配權重，不能直接說RTP不變。

**RC 細胞能量系統（全場共享的累積觸發機制）**

規格與機率：全隊每次擊殺加1格、集100格必覺醒30秒；傷害×2，期間不再累積下一次公共能量，結束清空。

### ④ e 新世紀エヴァンゲリオン ～はじまりの記憶～（ビスティ）

![e 新世紀エヴァンゲリオン はじまりの記憶 筐体](pachinko/images/07_eva17/cabinet.jpg)
![e 新世紀エヴァンゲリオン はじまりの記憶 ゲームフロー](pachinko/images/07_eva17/game_flow.jpg)
![e 新世紀エヴァンゲリオン はじまりの記憶 大当り詳細](pachinko/images/07_eva17/hit_rate.jpg)

**原作IP：** 動畫「新世紀エヴァンゲリオン」（庵野秀明 原作・監督）、パチンコシリーズ通算第17弾。ビスティ（旧FIELDS）のエヴァパチンコ20周年記念機種。

**賣點與好玩之處：**
- 通常時約1/399.9（図柄揃い）の ハイミドル 規格，合算大當確率約1/349.9
- 初當後約50.5%でST直行（チャージ昇格含む）、ST非突入時は時短100回転
- ST突入＝ラッキートリガー（LT）発動確定
- ST「インパクトモード」157回転、繼續率約80%が本機最大の強み
- LT中大當出玉はオール2400個以上（1200個×2回）、最大4800個（1200個×4回）
- 新要素「暴走モード」搭載：LT中の特定条件でLT継続+αの上乗せ効果
- 時短100回転（チャンスタイム）の引き戻し成功でもLT突入可能
- LT突入率は図柄揃い直行・チャージ・時短引き戻し合算で約61.4%
- 専用新筐体「超咆哮」：圧倒的な演出没入感を実現
- エヴァシリーズ伝統の予告演出を最新スペックで完全リニューアル
- ボイス・映像ともに圧倒的な質量：TV版の名場面を忠実に再現
- カスタム機能搭載：先読み強度・告知方式など多段階に設定可能
- シリーズ初の英語字幕対応：海外プレイヤーにも門戸を開く

**中心思想：**
> 「20年の記憶×繼續率80%の安定連莊」— e新世紀エヴァンゲリオン ～はじまりの記憶～ は、ビスティとエヴァIPの20年協力関係の集大成として設計されている。「シンジが逃げずに戦い続ける」という原作テーマが、「引き戻し確率と高繼續率で諦めずに連莊できる」LT設計として昇華されている。特に繼續率約80%のST157回転は、「この世界で生きていく」という覚悟に対応する安定感。通常版エヴァのパチンコが「2004年の衝撃＝1/399.9の重い確率を突破する達成感」であったとすれば、本機は「20年分の信頼に応える安定した高品質体験」を提供している。

**套用至其他遊戲的可能性：**
- 動作遊戲的「初號機覺醒系統」— 特定條件觸發暴走模式＋強化狀態
- RPG的「使徒 Boss 戰」— 段階性攻略＋達成後的豐厚獎勵循環
- 手遊的「高繼續率連鎖獎勵」— 確保玩家在連續投入後得到安定回報
- 音樂遊戲的「RUSH連鎖」— 連續完美判定觸發高倍率加成
- 卡牌遊戲的「AT FIELD（防禦貫通）」機制 — 突破防禦的爆發型攻擊設計

**Slot Game 轉用分析：**

- **使徒 Scatter ＋ 高繼續率 Free Spin（AT FIELD Break System）**
  對應「LT突入率61.4%＋ST157回転80%繼續率」的核心設計：Slot 中觸發 Scatter 後進入「ATF衝突判定」，以約60%機率「貫通AT FIELD」進入主力 Free Spin。成功貫通時保底獲得2400個積分（對應LT中最低出玉），且每轉有約80%機率「繼續」再給一次Free Spin（對應ST 157回転繼續率）。此設計讓玩家在主力 Free Spin 中的每一轉都是「80%還能繼續＋20%結束」的心理博弈，維持長時間的高度緊張感。

  **舉例：** 觸發3個 AT FIELD Scatter，畫面顯示初號機出擊「ATF 衝突判定 61%！」槍聲轟鳴後——「衝突突破！インパクトモード 突入！」。Free Spin 開始，第1轉獲得50x。第2轉系統詢問「繼續？（80%）」— 成功！第3轉 100x！第4轉... 第12轉... 第13轉「繼續失敗，インパクトモード終了」。前後共13轉，累積獲得1,840x的驚人獎金。那種每轉都在「還有80%機會繼續！」的期待中度過的體驗，完美還原 ST 連莊的緊張節奏。

- **暴走モード 上乗せ系統（Berserk Multiplier Stack）**
  對應「暴走モード」的特殊加成設計：Free Spin 中，每次特定符號（如「呪印保留」風格的特殊 Wild）出現，累積「暴走計数」。當計數達到閾值（如5次），觸發「暴走モード発動！」— 接下來的 Free Spin 全轉倍率×2，且額外追加5轉的上乗せ。暴走モード中再次累積可連鎖觸發，理論上可疊加多層。此設計創造出「越玩越強的正向反饋循環」，對應シンジの覚醒の階段。

  **舉例：** Free Spin 進行中，第3轉出現「呪印 Wild」，計數器顯示 1/5。第7轉再出現，2/5。第10轉...第14轉達到5/5！「暴走モード発動！」畫面變成紅黑色調，所有倍率×2，額外再給5轉。這5轉中第2轉又開始累積新一輪暴走計數... 最終觸發雙層暴走，倍率×4。玩家從「這輪 Free Spin 只有小中」的普通體驗，轉化為「暴走の連鎖爆発」的震撼大獎。

**機率設計要點套用：**

以下為轉用示範，非原機規格，尚未校準；各玩法分開示例，不預設全部疊加。

**使徒 Scatter ＋ 高繼續率 Free Spin（AT FIELD Break System）**

規格與機率：Scatter後60%進主Bonus、40%退出；成功先給2400積分，之後每輪完成以80%追加1轉、20%結束；追加轉的派彩另列，不把80%當中獎率。

**例子：** 進入後先得2400分，續行成功兩次多玩2轉，第三次失敗才結算。

**暴走モード 上乗せ系統（Berserk Multiplier Stack）**

規格與機率：每轉10%出暴走符號、每次加1計數；集5次必加5轉且倍率×2，再集5次可再觸發。示例上限3次、最高×8，其後只作普通符號。

**例子：** 第一次集滿由×1變×2並加5轉；第二次由×2變×4，再加5轉。

**Fish Game 轉用分析：**

- **AT FIELD 防禦系統（盾魚機制）**
  對應エヴァ最具代表性的「絶対領域（AT FIELD）」機制：捕魚機中導入「盾魚」系統，部分魚種帶有 AT FIELD 防護罩（半透明發光護盾），一般攻擊無法造成傷害。玩家必須使用特殊「AT FIELD 貫通砲」（需消耗額外彈藥，高費用高回報）才能突破，突破後獲得大量分數。此設計要求玩家判斷「高費用貫通是否值得」，創造策略性。AT FIELD 的厚度對應魚的稀有度，超稀有魚的護盾需多次貫通，形成「多輪投入→最終爆破」的節奏。

  **舉例：** 場上出現一隻「使徒 ラミエル」魚（超稀有），外層包覆多層六角形 AT FIELD。一般砲打上去全反彈。玩家按下「AT FIELD 貫通砲」（消耗3倍彈藥），第一擊破開最外層護盾，播放エヴァ主題曲片段。繼續貫通，第三擊——最後一層護盾崩潰！「ラミエル 撃破！」爆出5000分大獎。消耗了300彈藥，但獲得5000分，投入感十足。

- **使徒 Wave Boss 系統（週期性 Boss 挑戰）**
  對應原作中「第○使徒 出現！」的週期性緊張感設計：每隔固定時間（如10分鐘），場上出現當「使徒」(特殊Boss魚)——從弱到強依序為：Sachiel（第1次）→ Ramiel（第2次）→ Sahaquiel（第3次，最強）。每位使徒有獨特的行動模式和弱點，需要特定策略才能高效擊殺。成功擊殺進入「Victory Fanfare」演出，全場進入30秒高分時段（對應AT解除後的RUSH段）。若多人協作擊殺，額外獲得「協力Bonus」。

  **舉例：** 警報響起「第3使徒 サキエル 接近！」場上出現一隻帶十字光芒頭冠的大型魚，HP 6000，弱點在胸前的「コア」（特定時機才暴露）。普通攻擊可緩慢磨血，但攻擊コア時傷害×5！玩家需要觀察 サキエル 的動作週期（每8秒コア暴露3秒），在那3秒集中猛打。10分鐘後 第6使徒 カギ「使徒 第3形態 発現！」 難度升級。每次使徒出現都是「短暫高壓的集體戰鬥事件」，打破日常捕魚的平靜，讓玩家注意力高度集中。

**機率設計要點套用：**

以下為轉用示範，非原機規格，尚未校準；各玩法分開示例，不預設全部疊加。

**AT FIELD 防禦系統（盾魚機制）**

規格與機率：普通彈無法破盾；貫通彈每發扣5彈，每次有效命中50%削1層，普通盾1層、稀有盾3層。破盾後下一次有效命中必捕獲並發標示獎。

**例子：** 3層盾連中三次削層判定才歸零；只破一層不先發整隻魚獎。

**使徒 Wave Boss 系統（週期性 Boss 挑戰）**

規格與機率：每10分鐘固定一隻Boss；30秒內每次有效命中10傷，三階Boss血量依序200／400／600，歸零必開30秒高分場；多人參與另加固定100協力分。

**例子：** 第二隻需40次有效命中才成功；不再於擊殺後抽能否進高分場。

**本月最具亮點的設計：** e 新世紀エヴァンゲリオン ～はじまりの記憶～ 的「ST157回転＋80%繼續率」組合。在本月 TOP4 中是繼續率最高的機種，且 LT 突入率也是最高（61.4%）。這種「高突入＋高繼續」的雙高設計，在業界中屬於頂級水準，卻維持了1/399.9的適度難度，避免了超ハイスペック機種的過度門檻。

**市場趨勢觀察：** 
- **TOP4 高穩定性**：7月排名前4全部是6月導入以前的機種，新台衝擊力有限。7/6 大量導入的新台（e東京リベンジャーズ聖夜決戦編等）暫時未進入 TOP4。

function buildTOC() {
  const headings = content.querySelectorAll('h1,h2,h3');
  if (!headings.length) { toc.style.display = 'none'; return; }
  let s = '<h3>目次</h3>';
  headings.forEach((el, i) => {

  });
  toc.innerHTML = s;
}

function wrapAnalysisSections() {
  const paragraphs = content.querySelectorAll('p');
  paragraphs.forEach(p => {
    const strong = p.querySelector('strong');
    if (!strong) return;
    const text = strong.textContent;
    let className = null;
    if (text.includes('Slot Game 轉用分析')) className = 'slot-analysis';
    else if (text.includes('Fish Game 轉用分析')) className = 'fish-analysis';
    if (!className) return;
    const wrapper = document.createElement('div');
    wrapper.className = className;
    let sibling = p.nextElementSibling;
    const collected = [];
    while (sibling && !['H2','H3','HR'].includes(sibling.tagName) && !sibling.querySelector('strong[class]')) {
      const strongInside = sibling.querySelector('strong');
      if (strongInside && (strongInside.textContent.includes('Slot Game 轉用分析') || strongInside.textContent.includes('Fish Game 轉用分析'))) break;
      collected.push(sibling);
      sibling = sibling.nextElementSibling;
    }
    p.parentNode.insertBefore(wrapper, p);
    wrapper.appendChild(p);
    collected.forEach(el => wrapper.appendChild(el));
  });
}

function wrapExamples() {
  content.querySelectorAll('strong').forEach(strong => {
    if (!strong.textContent.includes('舉例')) return;
    const p = strong.closest('p');
    if (!p || p.closest('.example-block')) return;
    const wrapper = document.createElement('div');
    wrapper.className = 'example-block';
    p.parentNode.insertBefore(wrapper, p);
    wrapper.appendChild(p);
  });
}

function render() {

// Hash-based scroll: scroll to heading containing the hash text
function scrollToHash() {
  const hash = decodeURIComponent(window.location.hash.slice(1));
  if (!hash) return;
  const normalizedHash = hash.replace(/[\s\-]+/g, '');
  const headings = content.querySelectorAll('h1,h2,h3');
  for (const el of headings) {
    const normalizedText = el.textContent.replace(/[\s\-]+/g, '');
    if (normalizedText.includes(normalizedHash)) {
      setTimeout(() => {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        el.style.transition = 'background 0.3s';
        el.style.background = '#fff3cd';
        setTimeout(() => { el.style.background = ''; }, 2000);
      }, 300);
      return;
    }
  }
}
scrollToHash();
