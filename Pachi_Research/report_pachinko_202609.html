## 1. 人氣排名與關注度

根據 DMMぱちタウン 的「人氣機種」區塊及新台導入資訊，2026年9月的重點パチンコ機種如下（2026/09/29 排名抓取）。

### 9月排名重點分析

2026年9月最大的亮點是「e アサルトリリィ」空降人氣榜第三位。9月7日導入的這台新機種以輕規格（約1/164.4）搭配高繼續率（約80%），成功吸引大量輕度玩家和原作粉絲。

特別值得注目的是：
- **8月雙霸穩固地位**：SAO 夜空與ガンダムSEED 導入近2個月仍穩居 TOP2，展現強力 IP 的持久號召力。
- **アサルトリリィ輕規格制勝**：約1/164.4 是本期 TOP4 中最輕的規格，證明「低門檻」在當前市場的重要性。
- **リゼロ2導入前造勢**：10月5日預定導入的 Re:ゼロ 鬼がかり2 已躍升至人氣榜第四，展現超高期待度。
- **東京喰種系列退位**：連續霸榜多月的東京喰種系列被擠出 TOP4，但仍穩居第五、第六位。
- **タクトオーパス超ハイスペック嘗試**：約1/1394.38 的極端規格吸引部分核心玩家，但人氣排名不如預期。

**例子：** 三轉實際合計1200倍，補300倍到1500；不是再額外加1500倍。

### ③ e アサルトリリィ（ビスティ）

![e アサルトリリィ 筐体](pachinko/images/10_assault_lily/cabinet.jpg)
![e アサルトリリィ ゲームフロー](pachinko/images/10_assault_lily/game_flow.jpg)
![e アサルトリリィ 大当り詳細](pachinko/images/10_assault_lily/hit_rate.jpg)

**原作IP：** 動畫「アサルトリリィ BOUQUET」（SHAFT 製作）。描繪使用「CHARM」武器對抗神秘生物「ヒュージ」的少女們（リリィ）的戰鬥故事。百合題材＋美少女＋戰鬥動作的獨特組合。

**賣點與好玩之處：**
- 通常時 約1/164.4（図柄揃い）的ライト規格，初當取得容易
- 初當後 約25.3% 進入「ASSAULT RUSH」（LT 發動）
- RUSH 是 ST 100回転，繼續率約80%
- RUSH 中約1/65.5 觸發「閃撃ジャッジ」（最大3回転，大當確率1/2.3）
- 閃撃ジャッジ成功率約83%，失敗時可能リセット（不直接結束）
- 大當出玉為 1500個 / 3000個 / 4500個 三段階
- 「スキル」系統：カリスマ / 神宿 / 守護天使，獲得後有利展開
- 多種演出モード選擇：三撃決着 / たづまいコンビ / アダルトリリィ / ちびっこリリィ / アラヤ喰ライマックス
- 「ノインヴェルト戦術SP」9人リリィ集結的最強演出
- 搭載楽曲：ALIVE、花の塔、タカラモノ、Radiant、Trigger

**中心思想：**
> 「九人之絆的閃撃決着」— e アサルトリリィ 以「閃撃ジャッジ」為核心概念，對應原作中リリィ們瞬間決勝負的戰鬥風格。約1/164.4 的輕規格代表「リリィ們總是能站上戰場」，而 RUSH 中的閃撃ジャッジ（約83%成功率）則是「每次戰鬥都可能是決定性的一擊」。失敗後可能リセット而非直接結束的設計，對應原作中「絕望中仍有希望」的主題。5種演出モード讓玩家能以不同角度體驗百合ヶ丘女學院的世界，而「ノインヴェルト戦術」的9人集結演出則是原作最具代表性的場面再現。

**套用至其他遊戲的可能性：**
- 手遊的「羈絆連攜」系統 — 特定角色組合觸發強化效果
- 對戰遊戲的「シュッツエンゲル」配對系統 — 兩人一組的特殊搭配機制
- RPG 的「閃撃」戰鬥系統 — 短時間內連續判定勝負
- 收集育成遊戲的「リリィ培育」系統 — 美少女角色的成長與羈絆
- 音樂遊戲的「9人合奏」模式 — 集結所有角色的特殊演出

**Slot Game 轉用分析：**

- **閃撃ジャッジ系統（Flash Judge System）**
  對應「閃撃ジャッジ」的核心機制：Free Spin 中觸發「Judge 狀態」，接下來 3 轉以約 1/2.3 的高機率抽選大獎。成功率約83%，但即使失敗也有約50%機率觸發「リセット」讓 Free Spin 繼續而非結束。這種「高成功率＋失敗也有救濟」的設計讓玩家始終保持期待。

  **舉例：** Free Spin 進行中觸發「閃撃ジャッジ發動！」——畫面切換至戰鬥場景，接下來 3 轉每轉都是約 40% 機率擊中大獎。第 1 轉...miss！第 2 轉...miss！第 3 轉...「閃撃成功！」獲得 300x！即使第 3 轉也 miss，也有一半機率顯示「リセット！」Free Spin 從頭繼續。這種「絕處逢生」的設計正是アサルトリリィ的魅力。

- **シュッツエンゲル配對系統（Guardian Angel Pair Bonus）**
  對應原作中「守護對象與守護者」的シュッツエンゲル設定：遊戲中設定 2 位リリィ的配對，當兩人的 Symbol 同時出現在相鄰位置時觸發「シュッツエンゲル Bonus」，倍率 ×3。這鼓勵玩家關注特定 Symbol 組合，增加遊玩深度。

  **舉例：** 玩家選擇「梨璃＆夢結」作為シュッツエンゲル配對。Spin 結果顯示梨璃 Symbol 在 Reel 2、夢結 Symbol 在 Reel 3——「シュッツエンゲル發動！」兩人的特寫演出播放，該轉所有獎金 ×3。即使原本只有 20x 的獎金也變成 60x。選擇不同的配對組合會有不同的特殊演出。

**機率設計要點套用：**

以下為轉用示範，非原機規格，尚未校準；各玩法分開示例，不預設全部疊加。

**閃撃ジャッジ系統（Flash Judge System）**

規格與機率：Judge最多3次，每次獨立1/2.3成功，三次合計約81.9%；全失敗後才以50%重設一次。原文約83%保留為原描述，本例以約81.9%計。

**例子：** 三次都失敗但救濟成功，重給一輪3次；示例最多救濟一次，第二輪再失敗就退出。

**例子：** 本轉原獎10倍又出配對，就得30倍；原獎0倍仍0倍。

**Fish Game 轉用分析：**

- **CHARM 武器系統（Weapon Customization）**

### ④ eタクトオーパス デスティニー（ニューギン）

![eタクトオーパス デスティニー 筐体](pachinko/images/11_takt_op_destiny/cabinet.jpg)
![eタクトオーパス デスティニー ゲームフロー](pachinko/images/11_takt_op_destiny/game_flow.jpg)
![eタクトオーパス デスティニー 大当り詳細](pachinko/images/11_takt_op_destiny/hit_rate.jpg)

**原作IP：** 動畫「takt op.Destiny」（MAPPA × Madhouse 共同製作）。描繪「ムジカート」（將音樂化為武器的少女們）對抗「D2」（怪物）的近未來故事。音樂×戰鬥×公路電影的獨特組合。

**賣點與好玩之處：**
- 通常時 約1/1394.38（図柄揃い）的超ハイスペック規格
- 初當後 50% 進入「RUSH」（LT 發動）
- RUSH 繼續率高達約85%，業界頂級水準
- 大當出玉為 3000個 / 4500個 / 6000個 / 9000個，一擊爆發力驚人
- 通常時支援右打ち演出スキップ功能
- 「コンダクター（指揮者）」與「ムジカート」的搭檔演出
- 古典音樂融合的獨特世界觀

**中心思想：**
> 「沉默中等待的交響樂爆發」— eタクトオーパス デスティニー 以「超低機率＋超高繼續率」為核心設計，對應原作中「音樂消失的世界」到「音樂復活時刻」的對比。約1/1394.38 的超低機率代表「大多數時間的沉默」，而一旦當選後約85%的繼續率則是「音樂開始後的連綿不絕」。最大9000個的出玉則是「交響樂達到 Climax 時的震撼」。這種極端設計不適合所有玩家，但對追求「一擊逆轉」的核心玩家群有獨特吸引力。

**套用至其他遊戲的可能性：**
- 音樂遊戲的「Destiny Mode」— 超高難度但獎勵極高的模式
- RPG 的「覺醒系統」— 長時間累積後的超強化狀態
- 抽卡遊戲的「天井保底」機制 — 超低機率但有保底的極稀有角色
- Roguelike 的「極難路線」— 風險極高但報酬也極高的選擇
- 節奏遊戲的「交響樂章」模式 — 連續成功觸發的大型演出

**Slot Game 轉用分析：**

- **沉默與爆發系統（Silence to Symphony）**
  對應「超低機率＋超高繼續率」的核心設計：Slot 設計「沉默計數器」，每 Spin 累積「音符」，到達一定數量後觸發「Symphony Free Spin」。觸發機率極低（約1/1400），但一旦觸發就是繼續率約85%的高回報狀態。為避免長時間無回報的挫折感，設計「小節獎勵」每累積特定音符就有小額獎金。

  **舉例：** 持續 Spin 累積音符...50 符...100 符...（中途每 100 符獲得 5x 小獎）...終於在第 1387 轉觸發「Symphony Free Spin！」——畫面轉為古典音樂會場景。接下來的 Free Spin 繼續率高達 85%，每轉平均 50x。第 1 轉 60x！繼續！第 2 轉 40x！繼續！...連續 12 轉後結束，總獲得 720x。漫長等待換來的爆發正是本機的醍醐味。

- **ムジカート演出系統（Musicart Performance）**
  對應不同ムジカート角色的概念：Free Spin 中根據觸發條件選擇不同ムジカート，各有獨特演出和特性。「運命」（Destiny）全能型；「ヘル」（Hell）高傷害但短回合；「レニー」連擊型。角色選擇增加遊玩的策略性和收集要素。

  **舉例：** 觸發 Free Spin 時出現「ムジカート選擇」——「運命：標準繼續率 85%、平均倍率 ×30」「ヘル：繼續率 70%、倍率 ×50」「レニー：繼續率 90%、倍率 ×20」。玩家選擇「ヘル」追求高爆發——畫面變成火焰背景，ヘル 的戰鬥演出展開。每轉倍率較高但更容易結束，高風險高回報。

**機率設計要點套用：**

以下為轉用示範，非原機規格，尚未校準；各玩法分開示例，不預設全部疊加。

**沉默與爆發系統（Silence to Symphony）**

規格與機率：本例每轉1/1400開主Bonus，完成每輪後85%續行；每轉另必加1音符、每100音符給1倍小節獎。音符門檻只發小節獎，主Bonus採獨立抽選。

**例子：** 第100轉未中主Bonus，仍領1倍小節獎；第101轉依然是1/1400，不因等很久而保證中。

**ムジカート演出系統（Musicart Performance）**

規格與機率：三角色等機率選出：運命8轉、每轉30%得5倍；Hell4轉、每轉15%得20倍；レニー12轉、每轉50%得2倍，未中為0。

**例子：** 選到Hell，4轉只中一次就得20倍；與運命的回饋頻率不同，這三份示例各平均12倍。

**Fish Game 轉用分析：**

- **D2 侵蝕系統（D2 Invasion Event）**
  對應原作中「D2」怪物侵蝕世界的設定：遊戲中定期發生「D2 侵蝕事件」，畫面變成紅黑色調，出現特殊的「D2 型魚」。D2 型魚更難擊殺但獎勵更高，且擊殺後有機率觸發「ムジカート覺醒」讓砲台暫時強化。侵蝕事件持續約 60 秒後結束。

  **舉例：** 警報響起「D2 侵蝕發生！」——畫面轉為紅黑色調，出現「D2 中型魚」和「D2 Boss 魚」。D2 中型魚需要比普通中型魚多 50% 的彈藥才能擊殺，但獎勵 ×2。成功擊殺 D2 Boss 魚後——「運命覺醒！」接下來 30 秒砲台傷害 ×2。侵蝕事件結束後畫面恢復正常，但玩家已獲得豐厚獎勵。

- **交響樂累積系統（Symphony Build-Up）**
  對應「音樂累積後爆發」的概念：玩家每次擊殺魚類累積「音符 Gauge」，滿格時可發動「Symphony Attack」——選擇一首古典名曲，播放期間（約 20 秒）所有攻擊附帶全畫面衝擊波效果。不同曲目有不同效果：「運命」攻擊力＋50%；「月光」回復彈藥；「革命」速射模式。

  **舉例：** 持續擊殺累積音符 Gauge 至 100%——「Symphony Attack 準備完畢！」按下按鈕，出現曲目選擇「貝多芬・運命」「貝多芬・月光」「蕭邦・革命」。選擇「運命」——經典的「登登登登」旋律響起，接下來 20 秒每次射擊都附帶衝擊波，傷害 ×1.5。曲目播放結束後恢復正常，Gauge 歸零重新累積。

**機率設計要點套用：**

以下為轉用示範，非原機規格，尚未校準；各玩法分開示例，不預設全部疊加。

**D2 侵蝕系統（D2 Invasion Event）**

規格與機率：每5分鐘20%開60秒D2事件；每次有效命中D2魚2%捕獲、獎100分，捕獲後10%開15秒傷害×2；強化不疊加。

**例子：** 捕獲得100分但未抽中10%，就不強化；進強化也不再多發100分。

**交響樂累積系統（Symphony Build-Up）**

規格與機率：擊殺必加1音符、20音符可開20秒曲目；選運命必傷害×1.5，月光開場返10發，革命必射速×2且照常逐發扣彈。

**例子：** 20音符換月光必得10發；曲目不再以機率決定能否成功發動。

## 5. 綜合總結：中心思想比較與其他遊戲轉用可能性

| 機種 | 中心思想關鍵字 | 其他遊戲轉用度 | 轉用目標類型範例 |
|------|---------------|---------------|-----------------|
| e SAO アリシゼーション 夜空 | 雙層覺醒＋劍技爆發 | ★★★★★ | 手遊昇格、MMORPG轉職、Roguelike Buff |
| eフィーバー ガンダムSEED | 自由の翼＋CLIMAX 抉擇 | ★★★★★ | 對戰覺醒、射擊BURST、玩家選擇分岐 |
| e アサルトリリィ | 九人之絆＋閃撃決着 | ★★★★★ | 羈絆系統、配對Bonus、收集要素 |
| eタクトオーパス デスティニー | 沉默等待＋交響樂爆發 | ★★★☆☆ | 極端設計僅適合特定玩家群 |

**本月最具亮點的設計：** e アサルトリリィ 的「閃撃ジャッジ」系統。RUSH 中約1/65.5 觸發閃撃ジャッジ，在最大3回転內以約1/2.3（約43%）的高機率抽選大當——這種「短時間高密度判定」的設計讓每次觸發都緊張刺激。更妙的是失敗後約50%機率「リセット」讓 RUSH 繼續，而非直接結束。「高成功率＋失敗救濟」的組合讓玩家始終保持希望，正是「百合」題材「絕望中仍有希望」的完美詮釋。

**市場趨勢觀察：**
- **8月雙霸穩固**：SAO 夜空與ガンダムSEED 導入近2個月仍穩居 TOP2，證明「優質 IP＋紮實規格」的長期價值。
- **輕規格回歸主流**：アサルトリリィ（約1/164.4）空降第三，SAO 夜空（1/199.9）穩居第一，顯示「低門檻」在當前市場的重要性。
- **超ハイスペック市場有限**：タクトオーパス（約1/1394.38）的人氣表現不如預期，極端規格僅適合核心玩家群。
- **10月リゼロ2高期待**：導入前已躍升人氣榜第四，展現超強造勢能力。
- **東京喰種長青但退位**：連續霸榜多月後被擠出 TOP4，但仍穩居第五、第六，長期稼動力驚人。
- **百合題材新市場**：アサルトリリィ的成功證明「美少女百合」題材在パチンコ市場有可觀的潛力。

**長期稼動力分析：** SAO 夜空和ガンダムSEED 導入近2個月仍維持 TOP2，初步展現長期稼動力潛力。相較之下，東京喰種系列雖然被擠出 TOP4，但導入超過19個月（通常版）和4個月（超デカ ver.）仍穩居第五、第六，依然是業界長青標竿。アサルトリリィ的長期表現有待觀察，但「輕規格＋高繼續率＋美少女IP」的組合有潛力成為長青機種。

    let sibling = p.nextElementSibling;
    const collected = [];
    while (sibling && !['H2','H3','HR'].includes(sibling.tagName) && !sibling.querySelector('strong[class]')) {
      const strongInside = sibling.querySelector('strong');
      if (strongInside && (strongInside.textContent.includes('Slot Game 轉用分析') || strongInside.textContent.includes('Fish Game 轉用分析'))) break;
      collected.push(sibling);
      sibling = sibling.nextElementSibling;
    }
    p.parentNode.insertBefore(wrapper, p);
    wrapper.appendChild(p);
    collected.forEach(el => wrapper.appendChild(el));
  });
}

function wrapExamples() {
  content.querySelectorAll('strong').forEach(strong => {
    if (!strong.textContent.includes('舉例')) return;
    const p = strong.closest('p');
    if (!p || p.closest('.example-block')) return;
    const wrapper = document.createElement('div');
    wrapper.className = 'example-block';
    p.parentNode.insertBefore(wrapper, p);
    wrapper.appendChild(p);
  });
}

function render() {
  const mdEl = document.getElementById('report-md');
  if (!mdEl) return;
  let html = marked.parse(mdEl.textContent);
  content.innerHTML = html;
  content.querySelectorAll('img').forEach(img => {
    img.loading = 'lazy';
    img.onerror = function() {
      const e = document.createElement('span');
      e.className = 'img-error';
      e.textContent = '\u26A0 ' + img.getAttribute('src');
      img.parentNode.insertBefore(e, img.nextSibling);
      img.style.display = 'none';
    };
    img.onclick = () => { lightboxImg.src = img.src; lightbox.classList.add('active'); };
  });
  wrapAnalysisSections();
  wrapExamples();
  buildTOC();
}

btnToc.addEventListener('click', () => toc.classList.toggle('active'));
lightbox.addEventListener('click', () => lightbox.classList.remove('active'));
window.addEventListener('scroll', () => btnTop.classList.toggle('visible', window.scrollY > 400));
btnTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

render();

// Hash-based scroll: scroll to heading containing the hash text
function scrollToHash() {
  const hash = decodeURIComponent(window.location.hash.slice(1));
  if (!hash) return;
  const normalizedHash = hash.replace(/[\s\-]+/g, '');
  const headings = content.querySelectorAll('h1,h2,h3');
  for (const el of headings) {
    const normalizedText = el.textContent.replace(/[\s\-]+/g, '');
    if (normalizedText.includes(normalizedHash)) {
      setTimeout(() => {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        el.style.transition = 'background 0.3s';
        el.style.background = '#fff3cd';
        setTimeout(() => { el.style.background = ''; }, 2000);
      }, 300);
      return;
    }
  }
}
scrollToHash();
window.addEventListener('hashchange', scrollToHash);
</script>
